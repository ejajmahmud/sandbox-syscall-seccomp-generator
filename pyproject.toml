[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-syscall-seccomp-generator"
version = "0.1.0"
description = "Dynamic seccomp profile generator constructing minimal syscall filter whitelists tailored to agent tasks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
sandbox-syscall-seccomp-generator = "sandbox_syscall_seccomp_generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sandbox_syscall_seccomp_generator*"]
